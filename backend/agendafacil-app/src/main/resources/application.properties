# Aplicação
quarkus.application.name=agendafacil
quarkus.http.port=8080

# CORS usado pelo frontend em desenvolvimento.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${QUARKUS_HTTP_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type

# Locale padrão da aplicação.
quarkus.default-locale=pt-BR
quarkus.locales=pt-BR


# Datasource
# Em produção, as credenciais podem ser sobrescritas por variáveis de ambiente.
# Em dev/test, o Quarkus Dev Services sobe um PostgreSQL temporário automaticamente.
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/agendafacil}
%prod.quarkus.datasource.username=${DB_USER:agendafacil}
%prod.quarkus.datasource.password=${DB_PASSWORD:agendafacil}


# Hibernate ORM
# O schema é criado e atualizado pelo Flyway. O Hibernate apenas valida se as
# entidades estão compatíveis com as tabelas.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false


# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration


# OpenAPI / Swagger UI
quarkus.smallrye-openapi.info-title=AgendaFácil API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API do sistema de agendamento online AgendaFácil
quarkus.swagger-ui.always-include=true


# Perfil dev
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.datasource.devservices.image-name=postgres:16-alpine
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.format-sql=true


# Perfil test
%test.quarkus.datasource.devservices.enabled=true


# JWT / SmallRye MP-JWT
# As chaves em src/main/resources/jwt são usadas para desenvolvimento.
# Em produção, substitua os caminhos por chaves externas ao artefato da aplicação.
mp.jwt.verify.publickey.location=jwt/publicKey.pem
mp.jwt.verify.issuer=https://agendafacil.pucpr.br
smallrye.jwt.sign.key.location=jwt/privateKey.pem
smallrye.jwt.new-token.issuer=https://agendafacil.pucpr.br
smallrye.jwt.new-token.lifespan=3600
quarkus.smallrye-jwt.enabled=true
quarkus.native.resources.includes=jwt/*.pem


# Argon2id
# Parâmetros usados pelo PasswordHasher para geração e verificação de hashes.
agendafacil.security.argon2.memory-kib=65536
agendafacil.security.argon2.iterations=3
agendafacil.security.argon2.parallelism=1
agendafacil.security.argon2.salt-bytes=16
agendafacil.security.argon2.hash-bytes=32


# Configurações globais
# Valores carregados no startup pelo SystemConfigurationBootstrap e usados pelo
# SystemConfiguration Singleton.
agendafacil.timezone=America/Sao_Paulo
agendafacil.time-format=HH:mm
agendafacil.module.reviews.enabled=false
agendafacil.module.promotions.enabled=false
agendafacil.module.notifications.enabled=true


# Seed de demonstração
# Popula dados iniciais quando o banco está vazio. Em produção, desabilite com
# AGENDAFACIL_DEMO_SEED_ENABLED=false.
agendafacil.demo.seed.enabled=true
%test.agendafacil.demo.seed.enabled=false