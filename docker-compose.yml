services:
  db:
    image: postgres:16-alpine
    container_name: agendafacil-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-agendafacil}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agendafacil}
      POSTGRES_DB: ${DB_NAME:-agendafacil}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-agendafacil} -d ${DB_NAME:-agendafacil}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agendafacil-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-agendafacil}
      DB_USER: ${DB_USER:-agendafacil}
      DB_PASSWORD: ${DB_PASSWORD:-agendafacil}
      QUARKUS_HTTP_PORT: 8080
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agendafacil-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
